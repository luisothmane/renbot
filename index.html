<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Europa Lotto Zahlen-Checker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25' r='75%25'%3E%3Cstop offset='0%25' stop-color='%23ffe08a'/%3E%3Cstop offset='100%25' stop-color='%23c9781a'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='url(%23g)'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand" data-i18n="brand">Lotto Checker</div>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="de" type="button" title="Deutsch"><span class="flag">🇩🇪</span>DE</button>
        <button class="lang-btn" data-lang="fr" type="button" title="Français"><span class="flag">🇫🇷</span>FR</button>
        <button class="lang-btn" data-lang="nl" type="button" title="Nederlands"><span class="flag">🇳🇱</span>NL</button>
        <button class="lang-btn" data-lang="be" type="button" title="Belgique/België"><span class="flag">🇧🇪</span>BE</button>
      </div>
    </div>
  </div>

  <header>
    <div class="header-orbs" aria-hidden="true">
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>
      <span class="orb orb-3"></span>
      <span class="orb orb-4"></span>
    </div>
    <h1 data-i18n="headerTitle">Europa Lotto Zahlen-Checker</h1>
    <p data-i18n="headerSubtitle">Wähle eine Lotterie und prüfe deine Zahlen.</p>
  </header>

  <main>
    <section class="game-select-panel">
      <p class="section-kicker" data-i18n="gameSelectorLabel">Lotterie wählen</p>
      <div class="game-switch" id="gameSwitch"></div>
    </section>

    <section class="panel">
      <h2 data-i18n="yourNumbersTitle">1. Deine getippten Zahlen</h2>
      <p class="hint" id="yourNumbersHint">Wähle deine Zahlen.</p>

      <div class="group-label">
        <span data-i18n="mainNumbersLabel">Zahlen</span>
        <span class="count" id="yourMainCount">0 / 5</span>
      </div>
      <div class="grid" id="yourMainGrid"></div>

      <div class="bonus-section">
        <div class="group-label">
          <span id="yourBonusLabel">Sterne</span>
          <span class="count" id="yourBonusCount">0 / 2</span>
        </div>
        <div class="grid grid-bonus" id="yourBonusGrid"></div>
      </div>
    </section>

    <section class="panel">
      <h2 data-i18n="winningNumbersTitle">2. Ziehungszahlen</h2>
      <p class="hint" data-i18n="winningNumbersHint">Trage die offiziellen Gewinnzahlen ein.</p>

      <div class="group-label">
        <span data-i18n="mainNumbersLabel">Zahlen</span>
        <span class="count" id="winMainCount">0 / 5</span>
      </div>
      <div class="grid" id="winMainGrid"></div>

      <div class="bonus-section">
        <div class="group-label">
          <span id="winBonusLabel">Sterne</span>
          <span class="count" id="winBonusCount">0 / 2</span>
        </div>
        <div class="grid grid-bonus" id="winBonusGrid"></div>
      </div>

      <div class="example-row">
        <label for="exampleSelect" data-i18n="exampleDrawsLabel">Beispiel-Ziehung laden:</label>
        <select id="exampleSelect"></select>
      </div>
    </section>

    <div class="actions">
      <button class="btn btn-primary" id="checkBtn" data-i18n="checkButton" type="button">Zahlen prüfen</button>
      <button class="btn btn-secondary" id="resetBtn" data-i18n="resetButton" type="button">Zurücksetzen</button>
    </div>

    <p class="warning" id="incompleteWarning" hidden></p>

    <section class="panel result-panel" id="resultPanel" hidden>
      <h2 data-i18n="resultTitle">Ergebnis</h2>
      <p id="resultSummary"></p>
      <p id="resultTier" hidden></p>
      <p id="resultMessage"></p>
    </section>
  </main>

  <footer>
    <p data-i18n="footerDisclaimer"></p>
    <p data-i18n="footerNote"></p>
  </footer>

  <script src="assets/games.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
